# Levanta MySQL 8 para desarrollo local:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: sitral-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: sitral
      MYSQL_USER: sitral
      MYSQL_PASSWORD: sitral_pwd
      TZ: America/Bogota
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - sitral_mysql:/var/lib/mysql
volumes:
  sitral_mysql:
